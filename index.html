<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEOW Agent - Magical Document Scanner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
      * {
        font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      /* Floating cat in bottom right */
      .floating-cat {
        position: fixed;
        bottom: 30px;
        right: 30px;
        font-size: 60px;
        z-index: 50;
        animation: float 3s ease-in-out infinite;
        cursor: pointer;
        transition: transform 0.3s ease;
      }

      .floating-cat:hover {
        transform: scale(1.1);
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
      }

      @media (max-width: 768px) {
        .floating-cat {
          bottom: 20px;
          right: 20px;
          font-size: 45px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="floating-cat">🐱</div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
